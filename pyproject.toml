[project]
name = "yoink"
dynamic = ["version"]
description = "A small Qt front end for yt-dlp"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "PySide6>=6.6",
]

[project.scripts]
yoink = "yoink.__main__:main"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["yoink"]

# M.m.p on a clean v* tag, M.m.p+N.<hash> past it, .dirty if uncommitted.
[tool.uv-dynamic-versioning]
vcs = "git"
fallback-version = "0.0.0"
format-jinja = """
    {%- if distance == 0 and not dirty -%}
        {{ base }}
    {%- else -%}
        {{ base }}+{{ distance }}.{{ commit }}{% if dirty %}.dirty{% endif %}
    {%- endif -%}
"""

[tool.uv]
cache-keys = [{ git = { commit = true, tags = true } }]

[dependency-groups]
dev = [
    "mypy",
    "nuitka>=4.3.1",
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
# Legacy reference code, kept unmodified.
extend-exclude = ["old_do_not_copy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["yoink", "tests"]
strict = false

# PySide6 constructors accept any Qt property as a keyword (toolTip=,
# windowTitle=, ...), but the stubs list only the class's own properties, not
# inherited ones, so these calls fail to match. Runtime rejects bad names.
[[tool.mypy.overrides]]
module = ["yoink.ui.*"]
disable_error_code = ["call-arg", "call-overload"]
