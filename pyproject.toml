[project]
name = "yoink"
dynamic = ["version"]
description = "A small Qt front end for yt-dlp"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
]

[project.scripts]
yoink = "yoink.__main__:main"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["yoink"]

# M.m.p on a clean v* tag, M.m.p+N.<hash> past it, .dirty if uncommitted.
[tool.uv-dynamic-versioning]
vcs = "git"
fallback-version = "0.0.0"
format-jinja = """
    {%- if distance == 0 and not dirty -%}
        {{ base }}
    {%- else -%}
        {{ base }}+{{ distance }}.{{ commit }}{% if dirty %}.dirty{% endif %}
    {%- endif -%}
"""

[tool.uv]
cache-keys = [{ git = { commit = true, tags = true } }]

[dependency-groups]
dev = [
    "nuitka>=4.3.1",
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
